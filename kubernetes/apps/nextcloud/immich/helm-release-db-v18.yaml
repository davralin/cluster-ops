---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name immich-postgres-v18
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: raw
      version: v0.3.2
      sourceRef:
        kind: HelmRepository
        name: dysnix-charts
        namespace: flux-system
      interval: 30m
  driftDetection:
    mode: enabled
  targetNamespace: &namespace nextcloud
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  dependsOn:
    - name: plugin-barman-cloud
      namespace: flux-system
  values:
    resources:
      - apiVersion: barmancloud.cnpg.io/v1
        kind: ObjectStore
        metadata:
          name: *name
          namespace: *namespace
        spec:
          retentionPolicy: 7d
          configuration:
            destinationPath: s3://postgresql-${CLUSTER_NAME}
            endpointURL: "https://s3.${SECRET_DEFAULT_DOMAIN}"
            s3Credentials:
              accessKeyId:
                name: *name
                key: s3-access-key
              secretAccessKey:
                name: *name
                key: s3-secret-key
              region:
                name: *name
                key: region
            wal:
              compression: bzip2
              maxParallel: 4
      - apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: *name
          namespace: *namespace
        spec:
          # using only 1 replica: very difficult to drain the node where postgres is running
          # using more than 1 replica: write amplification issues when leveraging replicated storage (e.g. ceph)
          instances: 2
          affinity:
            enablePodAntiAffinity: true
            topologyKey: kubernetes.io/hostname
            podAntiAffinityType: required
          imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.4-1.1.1@sha256:9c9246cb8ba0332f7e1115def71329410657237db8ef104160a479a89c7e03a2
          primaryUpdateStrategy: unsupervised
          storage:
            size: 20Gi
            storageClass: "${STORAGE_READWRITEONCE}"
          walStorage:
            size: 10Gi
            storageClass: "${STORAGE_READWRITEONCE}"
          managed:
            roles:
              - name: immich
                login: true
                passwordSecret:
                  name: immich-basic-auth
          enableSuperuserAccess: true
          superuserSecret:
            name: *name
          bootstrap:
            # use this to start a new cluster
            #initdb:
            #  database: immich
            #  owner: immich
            #  secret:
            #    name: immich-basic-auth
            #  dataChecksums: true
            #  postInitApplicationSQL:
            #    - CREATE EXTENSION IF NOT EXISTS "vchord" CASCADE;
            #    - CREATE EXTENSION IF NOT EXISTS "earthdistance" CASCADE;
            #    # After bootup:
            #    # ALTER USER "immich" WITH SUPERUSER;
            #    # Wait for immich to init.
            #    # ALTER USER "immich" WITH NOSUPERUSER;
            # use this to recover a net-new cluster from a backup
            recovery:
              source: *name
              database: immich
              owner: immich
              secret:
                name: immich-basic-auth
            ## use this to 'migrate' from an existing cnpg cluster (e.g. "immich-postgres-v17") to the new cluster
            #initdb:
            #  database: immich
            #  owner: immich
            #  secret:
            #    name: immich-basic-auth
            #  import:
            #    type: microservice
            #    databases:
            #      - immich
            #    source:
            #      externalCluster: immich-postgres-v17
            #    postInitApplicationSQL:
            #      - CREATE EXTENSION IF NOT EXISTS "vchord" CASCADE;
            #      - CREATE EXTENSION IF NOT EXISTS "earthdistance" CASCADE;
          monitoring:
            enablePodMonitor: "${MONITORING_PROMETHEUS}"
          resources:
            requests:
              cpu: "400m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
          postgresql:
            shared_preload_libraries:
              - "vchord.so"
            enableAlterSystem: true
          plugins:
            - name: barman-cloud.cloudnative-pg.io
              isWALArchiver: true
              parameters:
                barmanObjectName: *name
          externalClusters:
            # this represents the s3 backup to restore from. Must be same version.
            - name: *name
              plugin:
                name: barman-cloud.cloudnative-pg.io
                parameters:
                  barmanObjectName: *name
                  serverName: *name
            ## this represents an existing cnpg cluster to migrate from (e.g. upgrading from postgres v17 to postgres v18)
            #- name: immich-postgres-v17
            #  connectionParameters:
            #    host: immich-postgres-v17-rw
            #    user: immich
            #    dbname: immich
            #    sslmode: require
            #  password:
            #    name: immich-basic-auth
            #    key: password
      - apiVersion: postgresql.cnpg.io/v1
        kind: ScheduledBackup
        metadata:
          name: *name
          namespace: *namespace
        spec:
          schedule: "0 10 09 * * *"
          immediate: true
          backupOwnerReference: self
          method: plugin
          pluginConfiguration:
            name: barman-cloud.cloudnative-pg.io
          cluster:
            name: *name
      - apiVersion: cilium.io/v2
        kind: CiliumNetworkPolicy
        metadata:
          name: *name
          namespace: *namespace
        spec:
          endpointSelector:
            matchLabels:
              cnpg.io/cluster: *name
          ingress:
            - fromEndpoints:
                - matchLabels:
                    k8s:cnpg.io/cluster: *name
                - matchLabels:
                    k8s:cnpg.io/jobRole: import
                    k8s:app.kubernetes.io/name: postgresql
                    k8s:app.kubernetes.io/component: database
                    k8s:app.kubernetes.io/managed-by: cloudnative-pg
                - matchLabels:
                    k8s:app.kubernetes.io/controller: main
                    k8s:app.kubernetes.io/instance: nextcloud-immich
                    k8s:app.kubernetes.io/name: machine-learning
                - matchLabels:
                    k8s:app.kubernetes.io/controller: main
                    k8s:app.kubernetes.io/instance: nextcloud-immich
                    k8s:app.kubernetes.io/name: server
              toPorts:
                - ports:
                    - port: "5432"
                      protocol: TCP
            - fromEndpoints:
                - matchLabels:
                    k8s:io.kubernetes.pod.namespace: cloudnative-pg
                    k8s:app.kubernetes.io/name: cloudnative-pg
                - matchLabels:
                    k8s:cnpg.io/cluster: *name
              toPorts:
                - ports:
                    - port: "8000"
                      protocol: TCP
            - fromEndpoints:
                - matchLabels:
                    k8s:io.kubernetes.pod.namespace: prometheus
                    k8s:app.kubernetes.io/name: prometheus
              toPorts:
                - ports:
                    - port: "9187"
                      protocol: TCP
          egress:
            - toEndpoints:
                - matchLabels:
                    k8s:cnpg.io/cluster: *name
              toPorts:
                - ports:
                    - port: "5432"
                      protocol: TCP
                    - port: "8000"
                      protocol: TCP
            - toEntities:
              - kube-apiserver
              toPorts:
              - ports:
                - port: "6443"
                  protocol: TCP
            - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
              toPorts:
                - ports:
                    - port: "53"
                      protocol: ANY
                  rules:
                    dns:
                      - matchName: "s3.${SECRET_DEFAULT_DOMAIN}"
                      - matchName: "immich-postgres-v18-rw.nextcloud.svc.cluster.local"
            - toFQDNs:
                - matchName: "s3.${SECRET_DEFAULT_DOMAIN}"
              toPorts:
                - ports:
                    - port: "443"
                      protocol: TCP
