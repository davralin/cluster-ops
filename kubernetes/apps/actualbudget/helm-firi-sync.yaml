---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name actual-firi-sync
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 30m
  driftDetection:
    mode: enabled
  targetNamespace: actualbudget
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  values:
    fullnameOverride: *name
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      actual-firi-sync:
        type: cronjob
        cronjob:
          concurrencyPolicy: Forbid
          schedule: "13 06 * * *"
          timeZone: "${TIMEZONE}"
          successfulJobsHistory: 3
          failedJobsHistory: 3
        containers:
          actual-firi-sync:
            image:
              repository: ghcr.io/davralin/actual-firi-sync
              tag: latest@sha256:1e51e196282368b20525d9a1329f27a3ba15a0ee902b696468c6cd8e8aa06a9d
            env:
              ACTUAL_SERVER_URL: http://actualbudget.actualbudget.svc.cluster.local:5006
              ACTUAL_ACCOUNT_NAME: Firi
              ACTUAL_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: actual-firi-sync
                    key: ACTUAL_PASSWORD
              ACTUAL_SYNC_ID:
                valueFrom:
                  secretKeyRef:
                    name: actual-firi-sync
                    key: ACTUAL_SYNC_ID
              FIRI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: actual-firi-sync
                    key: FIRI_API_KEY
              FIRI_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: actual-firi-sync
                    key: FIRI_CLIENT_ID
              FIRI_SECRET_KEY:
                valueFrom:
                  secretKeyRef:
                    name: actual-firi-sync
                    key: FIRI_SECRET_KEY
              TZ: "${TIMEZONE}"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    persistence:
      cache:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /app/cache
    networkpolicies:
      actual-firi-sync:
        enabled: true
        controller: *name
        policyTypes:
          - Egress
          - Ingress
        rules:
          egress:
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
              ports:
                - port: 53
                  protocol: UDP
            - to:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: actualbudget
              ports:
                - port: 5006
                  protocol: TCP
            - to:
                - ipBlock:
                    cidr: 0.0.0.0/0
                    except:
                    - "${HAPROXY_WHITELIST}"
              ports:
                - port: 443
                  protocol: TCP
          ingress: []
