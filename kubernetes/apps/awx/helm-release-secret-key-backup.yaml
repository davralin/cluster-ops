---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name awx-secret-key-backup
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: raw
      version: v0.3.2
      sourceRef:
        kind: HelmRepository
        name: dysnix-charts
        namespace: flux-system
      interval: 30m
  driftDetection:
    mode: enabled
  targetNamespace: &namespace awx
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  dependsOn:
    - name: awx-deployment
      namespace: awx
  values:
    resources:
      - apiVersion: v1
        kind: PersistentVolumeClaim
        metadata:
          name: *name
          namespace: *namespace
        spec:
          storageClassName: "${STORAGE_READWRITEONCE}"
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 1Gi
      - apiVersion: batch/v1
        kind: CronJob
        metadata:
          name: *name
          namespace: *namespace
        spec:
          schedule: "17 00 * * *"
          timeZone: Etc/UTC
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 3600
          successfulJobsHistoryLimit: 3
          failedJobsHistoryLimit: 3
          jobTemplate:
            spec:
              backoffLimit: 2
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: *name
                spec:
                  automountServiceAccountToken: false
                  enableServiceLinks: false
                  restartPolicy: OnFailure
                  securityContext:
                    runAsUser: 1000
                    runAsGroup: 1000
                    fsGroup: 1000
                    fsGroupChangePolicy: OnRootMismatch
                    runAsNonRoot: true
                    seccompProfile:
                      type: RuntimeDefault
                  containers:
                    - name: backup
                      image: docker.io/library/busybox:1.38.0@sha256:a46257e06c82ad85242d0d38077d0a52d9896389ca60a1a59d3463db586e5fa4
                      command:
                        - /bin/sh
                        - -ec
                      args:
                        - |
                          umask 077
                          cp /source/secret_key /backup/secret_key.tmp
                          chmod 0600 /backup/secret_key.tmp
                          mv /backup/secret_key.tmp /backup/secret_key
                      securityContext:
                        allowPrivilegeEscalation: false
                        readOnlyRootFilesystem: true
                        capabilities:
                          drop:
                            - ALL
                      resources:
                        requests:
                          cpu: 10m
                          memory: 64Mi
                        limits:
                          memory: 128Mi
                      volumeMounts:
                        - name: source
                          mountPath: /source
                          readOnly: true
                        - name: backup
                          mountPath: /backup
                  volumes:
                    - name: source
                      secret:
                        secretName: awx-secret-key
                        items:
                          - key: secret_key
                            path: secret_key
                    - name: backup
                      persistentVolumeClaim:
                        claimName: *name
