---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name alertmanager-dashboard
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 30m
  driftDetection:
    mode: enabled
  targetNamespace: alertmanager-dashboard
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  dependsOn:
    - name: alertmanager-dashboard-valkey
      namespace: flux-system
  values:
    fullnameOverride: *name
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      receiver:
        containers:
          receiver:
            image:
              repository: ghcr.io/davralin/alertmanager-dashboard-receiver
              tag: 2026.08.24@sha256:41e7f156aac8bd8e697dd58da465cb161bd8aa1ff6e237f379cddeabfe84fab6
            env:
              LISTEN_ADDR: ":8080"
              VALKEY_ADDR: "alertmanager-dashboard-valkey:6379"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup: *probes
            securityContext: &securityContext
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources: &resources
              requests:
                cpu: 5m
                memory: 16Mi
              limits:
                memory: 64Mi
      dashboard:
        containers:
          dashboard:
            image:
              repository: ghcr.io/davralin/alertmanager-dashboard-dashboard
              tag: 2026.08.31@sha256:759c12401fb0f32627f7294dcd603181b0dc714fa8b048e17c89e6dcfe55c210
            env:
              LISTEN_ADDR: ":8080"
              VALKEY_ADDR: "alertmanager-dashboard-valkey:6379"
              STALE_AFTER: "90m"
            probes:
              liveness: *probes
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              startup: *probes
            securityContext: *securityContext
            resources: *resources
      oauth2-proxy:
        containers:
          oauth2-proxy:
            image:
              repository: quay.io/oauth2-proxy/oauth2-proxy
              tag: v7.15.4@sha256:b1b2021fe8f4004573e8d690dec6c7bb29cc44364572cf8510a05bf3a0ae2ded
            args:
              - --http-address=0.0.0.0:4180
              - --upstream=http://alertmanager-dashboard.alertmanager-dashboard.svc.cluster.local:8080/
              - --provider=oidc
              - --provider-display-name=Pocket ID
              - --oidc-issuer-url=https://id.${SECRET_DEFAULT_DOMAIN}
              - --skip-oidc-discovery=true
              - --login-url=https://id.${SECRET_DEFAULT_DOMAIN}/authorize
              - --redeem-url=http://pocket-id.pocket-id.svc.cluster.local:8081/api/oidc/token
              - --profile-url=http://pocket-id.pocket-id.svc.cluster.local:8081/api/oidc/userinfo
              - --oidc-jwks-url=http://pocket-id.pocket-id.svc.cluster.local:8081/.well-known/jwks.json
              - --redirect-url=https://alertmanager-dashboard.${SECRET_DEFAULT_DOMAIN}/oauth2/callback
              - --scope=openid email profile groups
              - --email-domain=*
              - --reverse-proxy=true
              - --trusted-proxy-ip=10.244.0.0/16
              - --skip-provider-button=true
              - --cookie-secure=true
              - --cookie-samesite=lax
              - --cookie-refresh=1h
              - --cookie-expire=8h
            env:
              OAUTH2_PROXY_CLIENT_ID: "${SECRET_OAUTH2_PROXY_CLIENT_ID}"
              OAUTH2_PROXY_CLIENT_SECRET: "${SECRET_OAUTH2_PROXY_CLIENT_SECRET}"
              OAUTH2_PROXY_COOKIE_SECRET: "${SECRET_OAUTH2_PROXY_COOKIE_SECRET}"
            probes:
              liveness: &oauth2Probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: 4180
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness: *oauth2Probes
              startup: *oauth2Probes
            securityContext: *securityContext
            resources: *resources
    service:
      receiver:
        controller: receiver
        ports:
          http:
            port: *port
      dashboard:
        controller: dashboard
        ports:
          http:
            port: *port
      oauth2-proxy:
        controller: oauth2-proxy
        ports:
          http:
            port: 4180
    ingress:
      dashboard:
        enabled: true
        annotations:
          haproxy.org/allow-list: "${HAPROXY_WHITELIST}"
          haproxy.org/ssl-redirect-port: "443"
          haproxy.org/response-set-header: |
            Strict-Transport-Security "max-age=31536000"
            X-Frame-Options "DENY"
            X-Content-Type-Options "nosniff"
            Referrer-Policy "strict-origin-when-cross-origin"
        hosts:
          - host: &host "alertmanager-dashboard.${SECRET_DEFAULT_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: oauth2-proxy
                  port: http
        tls:
          - hosts:
              - *host
            secretName: "${SECRET_DEFAULT_DOMAIN_CERT}"
    networkpolicies:
      receiver:
        enabled: true
        controller: receiver
        policyTypes:
          - Ingress
          - Egress
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: prometheus
                  podSelector:
                    matchLabels:
                      alertmanager: kube-prom
                      app.kubernetes.io/instance: kube-prom
                      app.kubernetes.io/managed-by: prometheus-operator
                      app.kubernetes.io/name: alertmanager
              ports:
                - port: *port
                  protocol: TCP
          egress:
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
              ports:
                - port: 53
                  protocol: UDP
            - to:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: valkey
              ports:
                - port: 6379
                  protocol: TCP
      dashboard:
        enabled: true
        controller: dashboard
        policyTypes:
          - Ingress
          - Egress
        rules:
          ingress:
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: oauth2-proxy
              ports:
                - port: *port
                  protocol: TCP
          egress:
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
              ports:
                - port: 53
                  protocol: UDP
            - to:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: valkey
              ports:
                - port: 6379
                  protocol: TCP
      oauth2-proxy:
        enabled: true
        controller: oauth2-proxy
        policyTypes:
          - Ingress
          - Egress
        rules:
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: haproxy-controller
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: kubernetes-ingress
              ports:
                - port: 4180
                  protocol: TCP
          egress:
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
              ports:
                - port: 53
                  protocol: UDP
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: pocket-id
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: pocket-id
                      app.kubernetes.io/instance: pocket-id-pocket-id
                      app.kubernetes.io/name: pocket-id-pocket-id
              ports:
                - port: 8081
                  protocol: TCP
            - to:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: dashboard
              ports:
                - port: *port
                  protocol: TCP
