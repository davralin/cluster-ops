---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name kubevirt-manager
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 30m
  driftDetection:
    mode: enabled
  targetNamespace: kubevirt-manager
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  values:
    fullnameOverride: *name
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        runAsUser: 10000
        runAsGroup: 30000
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    serviceAccount:
      kubevirt-manager: {}
    controllers:
      kubevirt-manager:
        annotations:
          reloader.stakater.com/auto: "true"
        strategy: Recreate
        containers:
          kubevirt-manager:
            image:
              repository: docker.io/kubevirtmanager/kubevirt-manager
              tag: 1.5.4@sha256:1b98f1b5977a336c2dcd8b0e623f8343a70ff378bfa5ec094994fd4f68b100eb
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &port 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    configMaps:
      kubevirt-manager:
        enabled: true
        data:
          oauth2.conf: |
            auth_request /internal-auth/;
            auth_request_set $auth_redirect_url $upstream_http_location;
            auth_request_set $auth_status $upstream_status;
            error_page 401 = /oauth2/start?rd=https://$host$request_uri;
          default.conf: |
            map $http_upgrade $connection_upgrade {
                default upgrade;
                '' close;
            }

            server {
                listen 8080 default_server;
                listen [::]:8080 default_server;

                add_header Allow "GET, POST, HEAD, PUT, DELETE, PATCH" always;
                if ($request_method !~ ^(GET|POST|HEAD|PUT|DELETE|PATCH)$) {
                    return 405;
                }

                server_name  _;
                root /usr/share/nginx/html;
                index index.html index.htm;

                location ^~ /oauth2/ {
                    proxy_buffer_size   128k;
                    proxy_buffers   16 256k;
                    proxy_busy_buffers_size   256k;
                    proxy_temp_file_write_size 256k;
                    proxy_headers_hash_bucket_size 128;
                    proxy_headers_hash_max_size 512;

                    proxy_set_header Host       $host;
                    proxy_set_header X-Real-IP  $remote_addr;
                    proxy_set_header X-Forwarded-Uri $request_uri;
                    proxy_redirect off;

                    proxy_pass http://127.0.0.1:4180/oauth2/;
                }

                # Serve static content directly
                location ~* \.(js|css|json|gif|jpe?g|png)$ {
                    try_files $uri =404;
                    expires 30d;
                    add_header Cache-Control "public, max-age=2592000";
                }

                # Make sure /assets do not get redirected
                location /assets/ {
                    try_files $uri =404;
                }

                location ~ \.html$ {
                    add_header Content-Type "text/html; charset=UTF-8";
                }

                # This is our kubectl proxy
                location /k8s {
                    include /etc/nginx/auth.d/*.conf;

                    proxy_set_header X-Real-IP $remote_addr;
                    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                    proxy_set_header X-Forwarded-Proto $scheme;
                    proxy_set_header Authorization "";
                    proxy_pass_request_body on;
                    proxy_pass_request_headers on;
                    client_max_body_size 5g;

                    # Websocket for console and VNC
                    proxy_set_header Upgrade $http_upgrade;
                    proxy_set_header Connection $connection_upgrade;

                    # Longer timeouts
                    proxy_read_timeout 86400s;
                    proxy_send_timeout 86400s;
                    proxy_connect_timeout 86400s;

                    proxy_buffering off;
                    proxy_request_buffering off;
                    proxy_http_version 1.1;

                    proxy_pass http://127.0.0.1:8001/k8s;
                }

                location /internal-auth/ {
                    internal;
                    proxy_pass_request_body off;
                    proxy_set_header Content-Length "";
                    proxy_buffer_size   128k;
                    proxy_buffers   16 256k;
                    proxy_busy_buffers_size   256k;
                    proxy_temp_file_write_size 256k;
                    proxy_headers_hash_bucket_size 128;
                    proxy_headers_hash_max_size 512;

                    proxy_set_header Host       $host;
                    proxy_set_header X-Real-IP  $remote_addr;
                    proxy_set_header X-Forwarded-Uri $request_uri;

                    proxy_pass http://127.0.0.1:4180/oauth2/auth;
                }

                # Other locations (e.g. Prometheus)
                include /etc/nginx/location.d/*.conf;

                # Angular SPA
                location / {
                    # Fix 404s on Single Page Application
                    try_files $uri $uri/ /index.html;
                    include /etc/nginx/auth.d/*.conf;
                }
            }
    service:
      kubevirt-manager:
        controller: *name
        ports:
          http:
            port: *port
    ingress:
      kubevirt-manager:
        enabled: true
        annotations:
          haproxy.org/allow-list: "${HAPROXY_WHITELIST}"
          haproxy.org/ssl-redirect-port: "443"
          haproxy.org/timeout-client: 86400s
          haproxy.org/timeout-server: 86400s
          haproxy.org/timeout-tunnel: 86400s
          haproxy.org/response-set-header: |
            Strict-Transport-Security "max-age=31536000"
            X-Content-Type-Options "nosniff"
            Referrer-Policy "strict-origin-when-cross-origin"
        hosts:
          - host: &host "kubevirt-manager.${SECRET_DEFAULT_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: kubevirt-manager
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      nginx-cache:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /var/cache/nginx
      nginx-run:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /var/run
      nginx-tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /tmp
      oauth-config:
        enabled: true
        type: secret
        name: kubevirt-manager-oauth
        advancedMounts:
          kubevirt-manager:
            kubevirt-manager:
              - path: /etc/nginx/oauth.d/oauth2.conf
                subPath: oauth2.conf
                readOnly: true
      auth-config:
        enabled: true
        type: configMap
        name: kubevirt-manager
        advancedMounts:
          kubevirt-manager:
            kubevirt-manager:
              - path: /etc/nginx/auth.d/oauth2.conf
                subPath: oauth2.conf
                readOnly: true
              - path: /etc/nginx/conf.d/default.conf
                subPath: default.conf
                readOnly: true
    networkpolicies:
      kubevirt-manager:
        enabled: true
        controller: *name
        policyTypes:
          - Egress
          - Ingress
        rules:
          egress:
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
              ports:
                - port: 53
                  protocol: UDP
                - port: 53
                  protocol: TCP
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: pocket-id
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: pocket-id
                      app.kubernetes.io/instance: pocket-id-pocket-id
                      app.kubernetes.io/name: pocket-id-pocket-id
              ports:
                - port: 8081
                  protocol: TCP
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: haproxy-controller
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: kubernetes-ingress
              ports:
                - port: *port
