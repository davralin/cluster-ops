---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name n8n-postgres-v18
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: raw
      version: v0.3.2
      sourceRef:
        kind: HelmRepository
        name: dysnix-charts
        namespace: flux-system
      interval: 30m
  driftDetection:
    mode: enabled
  targetNamespace: &namespace n8n
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  dependsOn:
    - name: plugin-barman-cloud
      namespace: flux-system
  values:
    resources:
      - apiVersion: barmancloud.cnpg.io/v1
        kind: ObjectStore
        metadata:
          name: *name
          namespace: *namespace
        spec:
          retentionPolicy: 7d
          configuration:
            destinationPath: s3://postgresql-${CLUSTER_NAME}
            endpointURL: "${SECRET_S3_CNPG_URL}"
            s3Credentials:
              accessKeyId:
                name: *name
                key: s3-access-key
              secretAccessKey:
                name: *name
                key: s3-secret-key
              region:
                name: *name
                key: region
            wal:
              compression: bzip2
              maxParallel: 4
      - apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: *name
          namespace: *namespace
        spec:
          instances: 2
          affinity:
            enablePodAntiAffinity: true
            topologyKey: kubernetes.io/hostname
            podAntiAffinityType: required
          imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:c2a773217853c6e0ffe7da9c37ea456466efb20cf844f27511a73fa6a81e3152
          primaryUpdateStrategy: unsupervised
          storage:
            size: 10Gi
            storageClass: "${STORAGE_READWRITEONCE}"
          walStorage:
            size: 5Gi
            storageClass: "${STORAGE_READWRITEONCE}"
          managed:
            roles:
              - name: n8n
                login: true
                passwordSecret:
                  name: n8n-basic-auth
          superuserSecret:
            name: *name
          bootstrap:
            initdb:
              database: n8n
              owner: n8n
              secret:
                name: n8n-basic-auth
          monitoring:
            enablePodMonitor: "${MONITORING_PROMETHEUS}"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
          plugins:
            - name: barman-cloud.cloudnative-pg.io
              isWALArchiver: true
              parameters:
                barmanObjectName: *name
          externalClusters:
            - name: *name
              plugin:
                name: barman-cloud.cloudnative-pg.io
                parameters:
                  barmanObjectName: *name
                  serverName: *name
      - apiVersion: postgresql.cnpg.io/v1
        kind: ScheduledBackup
        metadata:
          name: *name
          namespace: *namespace
        spec:
          schedule: "0 41 01 * * *"
          immediate: true
          backupOwnerReference: self
          method: plugin
          pluginConfiguration:
            name: barman-cloud.cloudnative-pg.io
          cluster:
            name: *name
      - apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: *name
          namespace: *namespace
        spec:
          podSelector:
            matchLabels:
              cnpg.io/cluster: *name
          policyTypes:
            - Ingress
            - Egress
          ingress:
            - from:
                - podSelector:
                    matchLabels:
                      cnpg.io/cluster: *name
                - podSelector:
                    matchLabels:
                      cnpg.io/jobRole: import
                      app.kubernetes.io/name: postgresql
                      app.kubernetes.io/component: database
                      app.kubernetes.io/managed-by: cloudnative-pg
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: n8n-n8n
                      app.kubernetes.io/name: n8n
              ports:
                - port: 5432
                  protocol: TCP
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: cloudnative-pg
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: cloudnative-pg
                - podSelector:
                    matchLabels:
                      cnpg.io/cluster: *name
              ports:
                - port: 8000
                  protocol: TCP
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: prometheus
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: prometheus
              ports:
                - port: 9187
          egress:
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
              ports:
                - port: 53
                  protocol: UDP
                - port: 53
                  protocol: TCP
            - to:
                - podSelector:
                    matchLabels:
                      cnpg.io/cluster: *name
              ports:
                - port: 5432
                  protocol: TCP
                - port: 8000
                  protocol: TCP
            - to:
                - ipBlock:
                    cidr: 10.0.1.75/32
              ports:
                - port: 3900
                  protocol: TCP
      - apiVersion: cilium.io/v2
        kind: CiliumNetworkPolicy
        metadata:
          name: *name
          namespace: *namespace
        spec:
          endpointSelector:
            matchLabels:
              cnpg.io/cluster: *name
          egress:
            - toEntities:
                - kube-apiserver
              toPorts:
                - ports:
                    - port: "6443"
                      protocol: TCP
