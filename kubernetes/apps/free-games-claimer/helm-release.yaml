---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name free-games-claimer
  namespace: flux-system
spec:
  suspend: true
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 30m
  driftDetection:
    mode: enabled
  targetNamespace: free-games-claimer
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  values:
    fullnameOverride: *name
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: false
        seccompProfile:
          type: RuntimeDefault
    controllers:
      free-games-claimer:
        containers:
          free-games-claimer:
            image:
              repository: ghcr.io/p-adamiec/free-games-claimer-remaster
              tag: v1.9@sha256:28dfeaa134bd3ff52d9925b7e39523a512b8fc1d66768a3aff42dc48e87c1f1b
            env:
              TZ: "${TIMEZONE}"
              STORES: epic,gog,steam,aliexpress
              DRYRUN: "false"
              RUN_ON_STARTUP: "true"
              SCHEDULER_HOURS: "24"
              VNC_LOGIN_TIMEOUT: "900"
              DEBUG: "true"
              SHOW: "1"
              NOTIFY_UPDATES: "false"
              NOTIFY_SUMMARY: "true"
              NOTIFY_ERRORS: "true"
              NOTIFY_LOGIN_REQUEST: "true"
              VNC_URL: "https://free-games-claimer.${SECRET_DEFAULT_DOMAIN}"
              EG_EMAIL:
                valueFrom:
                  secretKeyRef:
                    name: free-games-claimer-login
                    key: EG_EMAIL
              EG_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: free-games-claimer-login
                    key: EG_PASSWORD
              EG_OTP_KEY:
                valueFrom:
                  secretKeyRef:
                    name: free-games-claimer-login
                    key: EG_OTP_KEY
              AE_EMAIL:
                valueFrom:
                  secretKeyRef:
                    name: free-games-claimer-login
                    key: AE_EMAIL
              AE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: free-games-claimer-login
                    key: AE_PASSWORD
              GOG_EMAIL:
                valueFrom:
                  secretKeyRef:
                    name: free-games-claimer-login
                    key: GOG_EMAIL
              GOG_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: free-games-claimer-login
                    key: GOG_PASSWORD
              STEAM_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: free-games-claimer-login
                    key: STEAM_USERNAME
              STEAM_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: free-games-claimer-login
                    key: STEAM_PASSWORD
              NOTIFY:
                valueFrom:
                  secretKeyRef:
                    name: free-games-claimer-login
                    key: NOTIFY
              VNC_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: free-games-claimer-login
                    key: VNC_PASSWORD
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 7080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 5
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 60
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      free-games-claimer:
        controller: *name
        ports:
          http:
            port: *port
    ingress:
      free-games-claimer:
        enabled: true
        annotations:
          haproxy.org/allow-list: "${HAPROXY_WHITELIST}"
          haproxy.org/ssl-redirect-port: "443"
          haproxy.org/response-set-header: |
            Strict-Transport-Security "max-age=31536000"
            X-Content-Type-Options "nosniff"
            Referrer-Policy "strict-origin-when-cross-origin"
        hosts:
          - host: &host "free-games-claimer.${SECRET_DEFAULT_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: free-games-claimer
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      data:
        enabled: true
        existingClaim: free-games-claimer
        globalMounts:
          - path: /fgc/data
      tmp:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /tmp
      root-vnc:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /root/.vnc
      root-cache:
        enabled: true
        type: emptyDir
        globalMounts:
          - path: /root/.cache
      dev-shm:
        enabled: true
        type: emptyDir
        medium: Memory
        globalMounts:
          - path: /dev/shm
    networkpolicies:
      free-games-claimer:
        enabled: true
        controller: *name
        policyTypes:
          - Egress
          - Ingress
        rules:
          egress:
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
              ports:
                - protocol: UDP
                  port: 53
                - protocol: TCP
                  port: 53
            - to:
                - ipBlock:
                    cidr: 0.0.0.0/0
                    except:
                      - "${HAPROXY_WHITELIST}"
              ports:
                - protocol: TCP
                  port: 80
                - protocol: TCP
                  port: 443
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: gotify
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: gotify-gotify
              ports:
                - protocol: TCP
                  port: 80
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: haproxy-controller
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: kubernetes-ingress
              ports:
                - port: *port
