---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name paperless-ngx-postgres-v18
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: raw
      version: v0.3.2
      sourceRef:
        kind: HelmRepository
        name: dysnix-charts
        namespace: flux-system
      interval: 30m
  driftDetection:
    mode: enabled
  targetNamespace: &namespace paperless-ngx
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  dependsOn:
    - name: cloudnative-pg
      namespace: flux-system
  values:
    resources:
      - apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: *name
          namespace: *namespace
        spec:
          # using only 1 replica: very difficult to drain the node where postgres is running
          # using more than 1 replica: write amplification issues when leveraging replicated storage (e.g. ceph)
          instances: 2
          affinity:
            enablePodAntiAffinity: true
            topologyKey: kubernetes.io/hostname
            podAntiAffinityType: required
          imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:c7747d8d1049fff9cf30d9cd83d14d609c957afb5ffbcd114145f393ea1850e1
          primaryUpdateStrategy: unsupervised
          storage:
            size: 2Gi
            storageClass: "${STORAGE_READWRITEONCE}"
          managed:
            roles:
              - name: paperless-ngx
                login: true
                passwordSecret:
                  name: paperless-ngx-basic-auth
          superuserSecret:
            name: *name
          bootstrap:
            # https://docs.paperless-ngx.com/administration/#importer
            # The importer should be run against a completely empty installation (database and directories) of Paperless-ngx.
            # use this to start a new cluster
            initdb:
              database: paperless-ngx
              owner: paperless-ngx
              secret:
                name: paperless-ngx-basic-auth
            # Backups are intentionally handled by paperless document_exporter + Borgmatic.
          monitoring:
            enablePodMonitor: "${MONITORING_PROMETHEUS}"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              memory: "1Gi"
      - apiVersion: cilium.io/v2
        kind: CiliumNetworkPolicy
        metadata:
          name: *name
          namespace: *namespace
        spec:
          endpointSelector:
            matchLabels:
              cnpg.io/cluster: *name
          ingress:
            - fromEndpoints:
                - matchLabels:
                    k8s:cnpg.io/cluster: *name
                - matchLabels:
                    k8s:cnpg.io/jobRole: import
                    k8s:app.kubernetes.io/name: postgresql
                    k8s:app.kubernetes.io/component: database
                    k8s:app.kubernetes.io/managed-by: cloudnative-pg
                - matchLabels:
                    k8s:app.kubernetes.io/controller: paperless-ngx
                    k8s:app.kubernetes.io/instance: paperless-ngx-paperless-ngx
                    k8s:app.kubernetes.io/name: paperless-ngx-paperless-ngx
              toPorts:
                - ports:
                    - port: "5432"
                      protocol: TCP
            - fromEndpoints:
                - matchLabels:
                    k8s:io.kubernetes.pod.namespace: cloudnative-pg
                    k8s:app.kubernetes.io/name: cloudnative-pg
                - matchLabels:
                    k8s:cnpg.io/cluster: *name
              toPorts:
                - ports:
                    - port: "8000"
                      protocol: TCP
            - fromEndpoints:
                - matchLabels:
                    k8s:io.kubernetes.pod.namespace: prometheus
                    k8s:app.kubernetes.io/name: prometheus
              toPorts:
                - ports:
                    - port: "9187"
                      protocol: TCP
          egress:
            - toEndpoints:
                - matchLabels:
                    k8s:cnpg.io/cluster: *name
              toPorts:
                - ports:
                    - port: "5432"
                      protocol: TCP
                    - port: "8000"
                      protocol: TCP
            - toEntities:
              - kube-apiserver
              toPorts:
              - ports:
                - port: "6443"
                  protocol: TCP
            - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
              toPorts:
                - ports:
                    - port: "53"
                      protocol: ANY
                  rules:
                    dns:
                      - matchName: "paperless-ngx-postgres-v18-rw.paperless-ngx.svc.cluster.local"
