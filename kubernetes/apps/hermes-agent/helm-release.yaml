---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name hermes-agent
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 30m
  driftDetection:
    mode: enabled
  targetNamespace: hermes-agent
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  values:
    global:
      createDefaultServiceAccount: true
    serviceAccount:
      hermes-agent: {}
    fullnameOverride: *name
    defaultPodOptions:
      automountServiceAccountToken: true
      enableServiceLinks: false
      securityContext:
        fsGroup: 10000
        fsGroupChangePolicy: "OnRootMismatch"
        seccompProfile:
          type: RuntimeDefault
        supplementalGroups:
          - 999 # Signal-cli
    controllers:
      hermes-agent:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          hermes-agent:
            image:
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.9.24@sha256:fca358f12efd65bfaaca05884166f15c0e2788375ca30d77061ac1ebc96452b7
            args: ["gateway", "run"]
            env:
              TZ: "${TIMEZONE}"
              HERMES_DASHBOARD: "0"
              SEARXNG_URL: "http://searxng.searxng.svc.cluster.local:8080"
              BROWSER_CDP_URL: "ws://browserless.browserless.svc.cluster.local:3000/chromium"
              OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: hermes-agent-secret
                    key: LITELLM_API_KEY
              PAPERLESS_API_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hermes-agent-secret
                    key: PAPERLESS_API_TOKEN
              MEALIE_API_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hermes-agent-secret
                    key: MEALIE_API_TOKEN
              DAWARICH_API_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hermes-agent-secret
                    key: DAWARICH_API_TOKEN
              SPARKYFITNESS_API_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hermes-agent-secret
                    key: SPARKYFITNESS_API_TOKEN
              ADGUARD_NATIVE_URL:
                valueFrom:
                  secretKeyRef:
                    name: hermes-agent-secret
                    key: ADGUARD_NATIVE_URL
              ADGUARD_NATIVE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: hermes-agent-secret
                    key: ADGUARD_NATIVE_USERNAME
              ADGUARD_NATIVE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: hermes-agent-secret
                    key: ADGUARD_NATIVE_PASSWORD
              ADGUARD_SOURCE_URL:
                valueFrom:
                  secretKeyRef:
                    name: hermes-agent-secret
                    key: ADGUARD_SOURCE_URL
              ADGUARD_SOURCE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: hermes-agent-secret
                    key: ADGUARD_SOURCE_USERNAME
              ADGUARD_SOURCE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: hermes-agent-secret
                    key: ADGUARD_SOURCE_PASSWORD
              SIGNAL_HTTP_URL: "http://hermes-signal.hermes-agent.svc.cluster.local:8080"
              SIGNAL_ACCOUNT:
                valueFrom:
                  secretKeyRef:
                    name: hermes-agent-secret
                    key: SIGNAL_ACCOUNT
              SIGNAL_ALLOWED_USERS:
                valueFrom:
                  secretKeyRef:
                    name: hermes-agent-secret
                    key: SIGNAL_ALLOWED_USERS
              FASTMAIL_API_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hermes-agent-secret
                    key: FASTMAIL_API_TOKEN
              HASS_URL: "https://home.${SECRET_DEFAULT_DOMAIN}"
              HASS_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: hermes-agent-secret
                    key: HASS_TOKEN
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 50m
              limits:
                memory: 1Gi
    persistence:
      opt:
        enabled: true
        existingClaim: hermes-agent
        globalMounts:
          - path: /opt/data
      shared:
        enabled: true
        existingClaim: shared
      tmp:
        enabled: true
        type: emptyDir
      run:
        enabled: true
        type: emptyDir
    networkpolicies:
      hermes-agent:
        enabled: true
        controller: *name
        policyTypes:
          - Egress
        rules:
          egress:
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
              ports:
                - port: 53
                  protocol: UDP
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: litellm
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: litellm
                      app.kubernetes.io/instance: litellm-litellm
                      app.kubernetes.io/name: litellm-litellm
              ports:
                - port: 4000
                  protocol: TCP
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: meridian
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: meridian
                      app.kubernetes.io/instance: meridian-meridian
                      app.kubernetes.io/name: meridian-meridian
              ports:
                - port: 3456
                  protocol: TCP

            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: searxng
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: searxng
                      app.kubernetes.io/instance: searxng-searxng
                      app.kubernetes.io/name: searxng-searxng
              ports:
                - port: 8080
                  protocol: TCP
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: browserless
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: browserless
                      app.kubernetes.io/instance: browserless-browserless
                      app.kubernetes.io/name: browserless-browserless
              ports:
                - port: 3000
                  protocol: TCP
            - to:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: hermes-signal
                      app.kubernetes.io/instance: hermes-agent-hermes-signal
                      app.kubernetes.io/name: hermes-agent-hermes-signal
              ports:
                - port: 8080
                  protocol: TCP
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: haproxy-controller
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: kubernetes-ingress
              ports:
                - port: 8443
                  protocol: TCP
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: forgejo
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/instance: forgejo-forgejo
                      app.kubernetes.io/name: forgejo
              ports:
                - port: 22
                  protocol: TCP
                - port: 2222
                  protocol: TCP
            - to: # Direct Home Assistant access
                - ipBlock:
                    cidr: 10.0.1.79/32
              ports:
                - port: 443
                  protocol: TCP
            - to: # AdGuard Home
                - ipBlock:
                    cidr: 10.0.1.1/32
              ports:
                - port: 80
                  protocol: TCP
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: prometheus
                  podSelector:
                    matchLabels:
                      prometheus: kube-prom
                      app.kubernetes.io/instance: kube-prom
                      app.kubernetes.io/managed-by: prometheus-operator
                      app.kubernetes.io/name: prometheus
              ports:
                - port: 9090
                  protocol: TCP
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: prometheus
                  podSelector:
                    matchLabels:
                      alertmanager: kube-prom
                      app.kubernetes.io/instance: kube-prom
                      app.kubernetes.io/managed-by: prometheus-operator
                      app.kubernetes.io/name: alertmanager
              ports:
                - port: 9093
                  protocol: TCP
            - to:
                - ipBlock:
                    cidr: 0.0.0.0/0
              ports:
                - port: 22
                  protocol: TCP
                - port: 443
                  protocol: TCP
    rbac:
      roles:
        hermes-agent:
          type: Role
          rules:
            - apiGroups: [""]
              resources: ["pods"]
              verbs: ["get", "list", "delete"]
            - apiGroups: [""]
              resources: ["pods/log"]
              verbs: ["get", "list"]
      bindings:
        hermes-agent:
          type: RoleBinding
          roleRef:
            identifier: hermes-agent
          subjects:
            - identifier: hermes-agent
    rawResources:
      cilium-kube-api:
        manifest:
          apiVersion: cilium.io/v2
          kind: CiliumNetworkPolicy
          spec:
            endpointSelector:
              matchLabels:
                app.kubernetes.io/controller: *name
            egress:
              - toEntities:
                  - kube-apiserver
                toPorts:
                  - ports:
                      - port: "6443"
                        protocol: TCP
