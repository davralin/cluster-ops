---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name external-dns
  namespace: flux-system
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: external-dns
      version: 1.23.0
      sourceRef:
        kind: HelmRepository
        name: external-dns-charts
        namespace: flux-system
      interval: 30m
  dependsOn:
    - name: kube-prometheus-stack-crds
      namespace: flux-system
    - name: adguard
      namespace: flux-system
  targetNamespace: external-dns
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  values:
    fullnameOverride: *name
    provider:
      name: webhook
      webhook:
        image:
          repository: ghcr.io/muhlba91/external-dns-provider-adguard
          tag: v11.2.0@sha256:a119f729b16d435769aefcd9d4be149d4be7142848439bafd45e4045aa0b2e4e
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
        env:
          - name: SERVER_HOST
            value: "0.0.0.0"
          - name: SERVER_PORT
            value: "8888"
          - name: HEALTHZ_HOST
            value: "0.0.0.0"
          - name: HEALTHZ_PORT
            value: "8080"
          - name: ADGUARD_URL
            value: http://adguard.adguard.svc.cluster.local:80
          - name: ADGUARD_USER
            valueFrom:
              secretKeyRef:
                name: external-dns-adguard-secret
                key: ADGUARD_USER
          - name: ADGUARD_PASSWORD
            valueFrom:
              secretKeyRef:
                name: external-dns-adguard-secret
                key: ADGUARD_PASSWORD
          - name: DRY_RUN
            value: "false"
          - name: ADGUARD_SET_IMPORTANT_FLAG
            value: "true"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsNonRoot: true
          runAsUser: 65532
          runAsGroup: 65532
          capabilities:
            drop:
              - ALL
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            memory: 128Mi
    sources:
      - service
      - ingress
    policy: sync
    registry: noop
    domainFilters:
      - ${SECRET_DEFAULT_DOMAIN}
    interval: 2m
    logLevel: info
    extraArgs:
      webhook-provider-url: http://localhost:8888
    serviceMonitor:
      enabled: ${MONITORING_PROMETHEUS}
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
