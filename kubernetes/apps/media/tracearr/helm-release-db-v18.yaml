---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name tracearr-postgres-v18
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: raw
      version: v0.3.2
      sourceRef:
        kind: HelmRepository
        name: dysnix-charts
        namespace: flux-system
      interval: 30m
  driftDetection:
    mode: enabled
  targetNamespace: &namespace media
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  dependsOn:
    - name: plugin-barman-cloud
      namespace: flux-system
  values:
    resources:
      - apiVersion: barmancloud.cnpg.io/v1
        kind: ObjectStore
        metadata:
          name: *name
          namespace: *namespace
        spec:
          retentionPolicy: 7d
          configuration:
            destinationPath: s3://postgresql-${CLUSTER_NAME}
            endpointURL: "${SECRET_S3_CNPG_URL}"
            s3Credentials:
              accessKeyId:
                name: *name
                key: s3-access-key
              secretAccessKey:
                name: *name
                key: s3-secret-key
              region:
                name: *name
                key: region
            wal:
              compression: bzip2
              maxParallel: 4
      - apiVersion: postgresql.cnpg.io/v1
        kind: ImageCatalog
        metadata:
          name: tracearr-timescaledb
          namespace: *namespace
        spec:
          images:
            - major: 18
              image: docker.io/timescale/timescaledb-ha:pg18.6-ts2.30.0@sha256:3fcfe605a44ccf4d543e1ed4f1fcc1c650e0efbd2c49b9803640768c9459ba66
      - apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: *name
          namespace: *namespace
        spec:
          instances: 2
          affinity:
            enablePodAntiAffinity: true
            topologyKey: kubernetes.io/hostname
            podAntiAffinityType: required
          imageCatalogRef:
            apiGroup: postgresql.cnpg.io
            kind: ImageCatalog
            name: tracearr-timescaledb
            major: 18
          primaryUpdateStrategy: unsupervised
          storage:
            size: 5Gi
            storageClass: "${STORAGE_READWRITEONCE}"
          walStorage:
            size: 2Gi
            storageClass: "${STORAGE_READWRITEONCE}"
          managed:
            roles:
              - name: tracearr
                login: true
                passwordSecret:
                  name: tracearr-basic-auth
          superuserSecret:
            name: *name
          bootstrap:
            initdb:
              database: tracearr
              owner: tracearr
              secret:
                name: tracearr-basic-auth
              postInitApplicationSQL:
                - CREATE EXTENSION IF NOT EXISTS timescaledb;
                - CREATE EXTENSION IF NOT EXISTS pg_trgm;
          monitoring:
            enablePodMonitor: "${MONITORING_PROMETHEUS}"
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
          postgresql:
            shared_preload_libraries:
              - "timescaledb"
            parameters:
              max_locks_per_transaction: "4096"
              timescaledb.license: "timescale"
              timescaledb.max_tuples_decompressed_per_dml_transaction: "100000"
              timescaledb.telemetry_level: "off"
          plugins:
            - name: barman-cloud.cloudnative-pg.io
              isWALArchiver: true
              parameters:
                barmanObjectName: *name
          externalClusters:
            - name: *name
              plugin:
                name: barman-cloud.cloudnative-pg.io
                parameters:
                  barmanObjectName: *name
                  serverName: *name
      - apiVersion: postgresql.cnpg.io/v1
        kind: ScheduledBackup
        metadata:
          name: *name
          namespace: *namespace
        spec:
          schedule: "0 43 01 * * *"
          immediate: true
          backupOwnerReference: self
          method: plugin
          pluginConfiguration:
            name: barman-cloud.cloudnative-pg.io
          cluster:
            name: *name
      - apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        metadata:
          name: *name
          namespace: *namespace
        spec:
          podSelector:
            matchLabels:
              cnpg.io/cluster: *name
          policyTypes:
            - Ingress
            - Egress
          ingress:
            - from:
                - podSelector:
                    matchLabels:
                      cnpg.io/cluster: *name
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: tracearr
                      app.kubernetes.io/instance: media-tracearr
                      app.kubernetes.io/name: media-tracearr
              ports:
                - port: 5432
                  protocol: TCP
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: cloudnative-pg
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: cloudnative-pg
                - podSelector:
                    matchLabels:
                      cnpg.io/cluster: *name
              ports:
                - port: 8000
                  protocol: TCP
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: prometheus
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: prometheus
              ports:
                - port: 9187
          egress:
            - to:
                - podSelector:
                    matchLabels:
                      cnpg.io/cluster: *name
              ports:
                - port: 5432
                  protocol: TCP
                - port: 8000
                  protocol: TCP
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
              ports:
                - port: 53
                  protocol: UDP
            - to:
                - ipBlock:
                    cidr: 10.0.1.75/32
              ports:
                - port: 3900
                  protocol: TCP
      - apiVersion: cilium.io/v2
        kind: CiliumNetworkPolicy
        metadata:
          name: *name
          namespace: *namespace
        spec:
          endpointSelector:
            matchLabels:
              cnpg.io/cluster: *name
          egress:
            - toEntities:
                - kube-apiserver
              toPorts:
                - ports:
                    - port: "6443"
                      protocol: TCP
