---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name tracearr-postgres-v18
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: raw
      version: v0.3.2
      sourceRef:
        kind: HelmRepository
        name: dysnix-charts
        namespace: flux-system
      interval: 30m
  driftDetection:
    mode: enabled
  targetNamespace: &namespace media
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  dependsOn:
    - name: plugin-barman-cloud
      namespace: flux-system
  values:
    resources:
      - apiVersion: barmancloud.cnpg.io/v1
        kind: ObjectStore
        metadata:
          name: *name
          namespace: *namespace
        spec:
          retentionPolicy: 7d
          configuration:
            destinationPath: s3://postgresql-${CLUSTER_NAME}
            endpointURL: "https://s3.${SECRET_DEFAULT_DOMAIN}"
            s3Credentials:
              accessKeyId:
                name: *name
                key: s3-access-key
              secretAccessKey:
                name: *name
                key: s3-secret-key
              region:
                name: *name
                key: region
            wal:
              compression: bzip2
              maxParallel: 4
      - apiVersion: postgresql.cnpg.io/v1
        kind: ImageCatalog
        metadata:
          name: tracearr-timescaledb
          namespace: *namespace
        spec:
          images:
            - major: 18
              image: docker.io/timescale/timescaledb-ha:pg18.6-ts2.30.0@sha256:3fcfe605a44ccf4d543e1ed4f1fcc1c650e0efbd2c49b9803640768c9459ba66
      - apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: *name
          namespace: *namespace
        spec:
          # using only 1 replica: very difficult to drain the node where postgres is running
          # using more than 1 replica: write amplification issues when leveraging replicated storage (e.g. ceph)
          instances: 2
          affinity:
            enablePodAntiAffinity: true
            topologyKey: kubernetes.io/hostname
            podAntiAffinityType: required
          imageCatalogRef:
            apiGroup: postgresql.cnpg.io
            kind: ImageCatalog
            name: tracearr-timescaledb
            major: 18
          primaryUpdateStrategy: unsupervised
          postgresUID: 1000
          postgresGID: 1000
          storage:
            size: 5Gi
            storageClass: "${STORAGE_READWRITEONCE}"
          walStorage:
            size: 2Gi
            storageClass: "${STORAGE_READWRITEONCE}"
          managed:
            roles:
              - name: tracearr
                login: true
                passwordSecret:
                  name: tracearr-basic-auth
          superuserSecret:
            name: *name
          bootstrap:
            # use this to start a new cluster
            #initdb:
            #  database: tracearr
            #  owner: tracearr
            #  secret:
            #    name: tracearr-basic-auth
            # use this to recover a net-new cluster from a backup
            recovery:
              source: *name
              database: tracearr
              owner: tracearr
              secret:
                name: tracearr-basic-auth
            ## use this to 'migrate' from an existing cnpg cluster (e.g. "tracearr-postgres-v17") to the new cluster
            #initdb:
            #  database: tracearr
            #  owner: tracearr
            #  import:
            #    type: microservices
            #    databases:
            #      - tracearr
            #    source:
            #      externalCluster: tracearr-postgres-v17
          monitoring:
            enablePodMonitor: "${MONITORING_PROMETHEUS}"
          resources:
            requests:
              cpu: "100m"
              memory: "512Mi"
            limits:
              memory: "1Gi"
          postgresql:
            shared_preload_libraries:
              - "timescaledb"
            parameters:
              max_locks_per_transaction: "4096"
              timescaledb.license: "timescale"
              timescaledb.max_tuples_decompressed_per_dml_transaction: "100000"
              timescaledb.telemetry_level: "off"
          plugins:
            - name: barman-cloud.cloudnative-pg.io
              isWALArchiver: true
              parameters:
                barmanObjectName: *name
          externalClusters:
            # this represents the s3 backup to restore from. Must be same version.
            - name: *name
              plugin:
                name: barman-cloud.cloudnative-pg.io
                parameters:
                  barmanObjectName: *name
                  serverName: *name
            ## this represents an existing cnpg cluster to migrate from (e.g. upgrading from postgres v17 to postgres v18)
            #- name: tracearr-postgres-v17
            #  connectionParameters:
            #    host: tracearr-postgres-v17-rw
            #    user: tracearr
            #    dbname: tracearr
            #    sslmode: require
            #  password:
            #    name: tracearr-basic-auth
            #    key: password
      - apiVersion: postgresql.cnpg.io/v1
        kind: ScheduledBackup
        metadata:
          name: *name
          namespace: *namespace
        spec:
          schedule: "0 43 01 * * *"
          immediate: true
          backupOwnerReference: self
          method: plugin
          pluginConfiguration:
            name: barman-cloud.cloudnative-pg.io
          cluster:
            name: *name
      - apiVersion: cilium.io/v2
        kind: CiliumNetworkPolicy
        metadata:
          name: *name
          namespace: *namespace
        spec:
          endpointSelector:
            matchLabels:
              cnpg.io/cluster: *name
          ingress:
            - fromEndpoints:
                - matchLabels:
                    k8s:cnpg.io/cluster: *name
                - matchLabels:
                    k8s:cnpg.io/jobRole: import
                    k8s:app.kubernetes.io/name: postgresql
                    k8s:app.kubernetes.io/component: database
                    k8s:app.kubernetes.io/managed-by: cloudnative-pg
                - matchLabels:
                    k8s:app.kubernetes.io/controller: tracearr
                    k8s:app.kubernetes.io/instance: media-tracearr
                    k8s:app.kubernetes.io/name: media-tracearr
              toPorts:
                - ports:
                    - port: "5432"
                      protocol: TCP
            - fromEndpoints:
                - matchLabels:
                    k8s:io.kubernetes.pod.namespace: cloudnative-pg
                    k8s:app.kubernetes.io/name: cloudnative-pg
                - matchLabels:
                    k8s:cnpg.io/cluster: *name
              toPorts:
                - ports:
                    - port: "8000"
                      protocol: TCP
            - fromEndpoints:
                - matchLabels:
                    k8s:io.kubernetes.pod.namespace: prometheus
                    k8s:app.kubernetes.io/name: prometheus
              toPorts:
                - ports:
                    - port: "9187"
                      protocol: TCP
          egress:
            - toEndpoints:
                - matchLabels:
                    k8s:cnpg.io/cluster: *name
              toPorts:
                - ports:
                    - port: "5432"
                      protocol: TCP
                    - port: "8000"
                      protocol: TCP
            - toEntities:
              - kube-apiserver
              toPorts:
              - ports:
                - port: "6443"
                  protocol: TCP
            - toEndpoints:
              - matchLabels:
                  k8s:io.kubernetes.pod.namespace: kube-system
                  k8s:k8s-app: kube-dns
              toPorts:
                - ports:
                    - port: "53"
                      protocol: ANY
                  rules:
                    dns:
                      - matchName: "s3.${SECRET_DEFAULT_DOMAIN}"
                      - matchName: "tracearr-postgres-v18-rw.media.svc.cluster.local"
            - toFQDNs:
                - matchName: "s3.${SECRET_DEFAULT_DOMAIN}"
              toPorts:
                - ports:
                    - port: "443"
                      protocol: TCP
