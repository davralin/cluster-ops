---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name questarr-postgres-v18
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: raw
      version: v0.3.2
      sourceRef:
        kind: HelmRepository
        name: dysnix-charts
        namespace: flux-system
      interval: 30m
  driftDetection:
    mode: enabled
  targetNamespace: &namespace media
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  dependsOn:
    - name: plugin-barman-cloud
      namespace: flux-system
  values:
    resources:
      - apiVersion: barmancloud.cnpg.io/v1
        kind: ObjectStore
        metadata:
          name: *name
          namespace: *namespace
        spec:
          retentionPolicy: 7d
          configuration:
            destinationPath: s3://postgresql-${CLUSTER_NAME}
            endpointURL: "https://s3.${SECRET_DEFAULT_DOMAIN}"
            s3Credentials:
              accessKeyId:
                name: *name
                key: s3-access-key
              secretAccessKey:
                name: *name
                key: s3-secret-key
              region:
                name: *name
                key: region
            wal:
              compression: bzip2
              maxParallel: 4
      - apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: *name
          namespace: *namespace
        spec:
          instances: 2
          affinity:
            enablePodAntiAffinity: true
            topologyKey: kubernetes.io/hostname
            podAntiAffinityType: required
          imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:39add80f5b1e573e2f6b641c66fd1a2f8dede67ca0330e870285bc1078551390
          primaryUpdateStrategy: unsupervised
          storage:
            size: 4Gi
            storageClass: "${STORAGE_READWRITEONCE}"
          walStorage:
            size: 4Gi
            storageClass: "${STORAGE_READWRITEONCE}"
          bootstrap:
            initdb:
              database: questarr
              owner: questarr
          monitoring:
            enablePodMonitor: "${MONITORING_PROMETHEUS}"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          plugins:
            - name: barman-cloud.cloudnative-pg.io
              isWALArchiver: true
              parameters:
                barmanObjectName: *name
          externalClusters:
            - name: *name
              plugin:
                name: barman-cloud.cloudnative-pg.io
                parameters:
                  barmanObjectName: *name
                  serverName: *name
      - apiVersion: postgresql.cnpg.io/v1
        kind: ScheduledBackup
        metadata:
          name: *name
          namespace: *namespace
        spec:
          schedule: "0 17 02 * * *"
          immediate: true
          backupOwnerReference: self
          method: plugin
          pluginConfiguration:
            name: barman-cloud.cloudnative-pg.io
          cluster:
            name: *name
      - apiVersion: cilium.io/v2
        kind: CiliumNetworkPolicy
        metadata:
          name: *name
          namespace: *namespace
        spec:
          endpointSelector:
            matchLabels:
              cnpg.io/cluster: *name
          ingress:
            - fromEndpoints:
                - matchLabels:
                    k8s:cnpg.io/cluster: *name
                - matchLabels:
                    k8s:cnpg.io/jobRole: import
                    k8s:app.kubernetes.io/name: postgresql
                    k8s:app.kubernetes.io/component: database
                    k8s:app.kubernetes.io/managed-by: cloudnative-pg
                - matchLabels:
                    k8s:app.kubernetes.io/controller: questarr
                    k8s:app.kubernetes.io/instance: media-questarr
                    k8s:app.kubernetes.io/name: media-questarr
              toPorts:
                - ports:
                    - port: "5432"
                      protocol: TCP
            - fromEndpoints:
                - matchLabels:
                    k8s:io.kubernetes.pod.namespace: cloudnative-pg
                    k8s:app.kubernetes.io/name: cloudnative-pg
                - matchLabels:
                    k8s:cnpg.io/cluster: *name
              toPorts:
                - ports:
                    - port: "8000"
                      protocol: TCP
            - fromEndpoints:
                - matchLabels:
                    k8s:io.kubernetes.pod.namespace: prometheus
                    k8s:app.kubernetes.io/name: prometheus
              toPorts:
                - ports:
                    - port: "9187"
                      protocol: TCP
          egress:
            - toEndpoints:
                - matchLabels:
                    k8s:cnpg.io/cluster: *name
              toPorts:
                - ports:
                    - port: "5432"
                      protocol: TCP
                    - port: "8000"
                      protocol: TCP
            - toEntities:
                - kube-apiserver
              toPorts:
                - ports:
                    - port: "6443"
                      protocol: TCP
            - toEndpoints:
                - matchLabels:
                    k8s:io.kubernetes.pod.namespace: kube-system
                    k8s:k8s-app: kube-dns
              toPorts:
                - ports:
                    - port: "53"
                      protocol: ANY
                  rules:
                    dns:
                      - matchName: "s3.${SECRET_DEFAULT_DOMAIN}"
                      - matchName: "questarr-postgres-v18-rw.media.svc.cluster.local"
            - toFQDNs:
                - matchName: "s3.${SECRET_DEFAULT_DOMAIN}"
              toPorts:
                - ports:
                    - port: "443"
                      protocol: TCP
