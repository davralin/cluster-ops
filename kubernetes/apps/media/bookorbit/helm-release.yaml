---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name bookorbit
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.0.1
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 30m
  driftDetection:
    mode: enabled
  targetNamespace: media
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  dependsOn:
    - name: bookorbit-postgres-v18
      namespace: flux-system
  values:
    fullnameOverride: *name
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      hostname: *name
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      bookorbit:
        containers:
          bookorbit:
            image:
              repository: ghcr.io/bookorbit/bookorbit
              tag: 2.3.0@sha256:62048532c82ad4cfe9b728707136f140516f0f35766c2dc97969f22ed67794ae
            env:
              NODE_ENV: production
              TZ: "${TIMEZONE}"
              PORT: &port 3000
              APP_URL: &appUrl "https://bookorbit.${SECRET_DEFAULT_DOMAIN}"
              CLIENT_URL: *appUrl
              POSTGRES_HOST: bookorbit-postgres-v18-rw.media.svc.cluster.local
              POSTGRES_PORT: "5432"
              POSTGRES_USER: bookorbit
              POSTGRES_DB: bookorbit
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-basic-auth
                    key: password
              JWT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-secret
                    key: JWT_SECRET
              SETUP_BOOTSTRAP_TOKEN:
                valueFrom:
                  secretKeyRef:
                    name: bookorbit-secret
                    key: SETUP_BOOTSTRAP_TOKEN
              PUID: 1000
              PGID: 1000
              LIBRARY_BROWSE_ROOT: /books
              BOOK_DOCK_PATH: /data/book-dock
              OIDC_ALLOW_LOCAL_ISSUERS: "true"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probes
              startup:
                <<: *probes
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
    service:
      bookorbit:
        controller: *name
        ports:
          http:
            port: *port
    ingress:
      bookorbit:
        enabled: true
        annotations:
          haproxy.org/allow-list: "${HAPROXY_WHITELIST}"
          haproxy.org/ssl-redirect-port: "443"
          haproxy.org/response-set-header: |
            Strict-Transport-Security "max-age=31536000"
            X-Frame-Options "DENY"
            X-Content-Type-Options "nosniff"
            Referrer-Policy "strict-origin-when-cross-origin"
        hosts:
          - host: &host "bookorbit.${SECRET_DEFAULT_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: bookorbit
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      data:
        enabled: true
        existingClaim: bookorbit
      literature:
        enabled: true
        existingClaim: media
        globalMounts:
          - path: /books
            subPath: literature
            readOnly: true
      tmp:
        type: emptyDir
    networkpolicies:
      bookorbit:
        enabled: true
        controller: *name
        policyTypes:
          - Egress
          - Ingress
        rules:
          egress:
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
              ports:
                - port: 53
                  protocol: UDP
            - to:
                - podSelector:
                    matchLabels:
                      cnpg.io/cluster: bookorbit-postgres-v18
                      cnpg.io/instanceRole: primary
              ports:
                - port: 5432
                  protocol: TCP
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: pocket-id
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: pocket-id
                      app.kubernetes.io/instance: pocket-id-pocket-id
                      app.kubernetes.io/name: pocket-id-pocket-id
              ports:
                - port: 8081
                  protocol: TCP
            - to: # metadata providers, external sync integrations, pocketid over ingress
              - ipBlock:
                  cidr: 0.0.0.0/0
              ports:
                - port: 443
                  protocol: TCP
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: haproxy-controller
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: kubernetes-ingress
              ports:
                - port: *port
