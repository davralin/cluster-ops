---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name spotify-navidrome-sync
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.1.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 30m
  driftDetection:
    mode: enabled
  targetNamespace: media
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  values:
    fullnameOverride: *name
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      spotify-navidrome-sync:
        type: cronjob
        cronjob:
          schedule: "29 11 * * *"
          timeZone: "${TIMEZONE}"
        containers:
          spotify-navidrome-sync:
            image:
              repository: ghcr.io/davralin/spotify-navidrome-sync
              tag: 2026.08.31@sha256:530d62bdff97c14e2dd3cabeef8b2f8fc1ccda70eb4d4e0b9b2e4a4b2d43f434
            args:
              - /config/config.yaml
            env:
              SPOTIFY_CLIENT_ID:
                valueFrom:
                  secretKeyRef:
                    name: spotify-navidrome-sync
                    key: SPOTIFY_CLIENT_ID
              SPOTIFY_CLIENT_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: spotify-navidrome-sync
                    key: SPOTIFY_CLIENT_SECRET
              NAVIDROME_URL: http://navidrome.media.svc.cluster.local:4533
              NAVIDROME_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: spotify-navidrome-sync
                    key: SUBSONIC_API_USER
              NAVIDROME_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: spotify-navidrome-sync
                    key: SUBSONIC_API_PASS
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 2Gi
    persistence:
      config:
        enabled: true
        type: configMap
        name: spotify-navidrome-sync
        advancedMounts:
          spotify-navidrome-sync:
            spotify-navidrome-sync:
              - path: /config/config.yaml
                subPath: config.yaml
                readOnly: true
      media:
        enabled: true
        existingClaim: media
        advancedMounts:
          spotify-navidrome-sync:
            spotify-navidrome-sync:
              - path: /media
                subPath: audio/rip
      tmp:
        enabled: true
        type: emptyDir
        advancedMounts:
          spotify-navidrome-sync:
            spotify-navidrome-sync:
              - path: /tmp
    networkpolicies:
      spotify-navidrome-sync:
        enabled: true
        controller: *name
        policyTypes:
          - Egress
          - Ingress
        rules:
          egress:
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
              ports:
                - port: 53
                  protocol: UDP
            - to: # Spotify API and downloader HTTPS targets
              - ipBlock:
                  cidr: 0.0.0.0/0
                  except:
                  - "${HAPROXY_WHITELIST}"
              ports:
                - port: 443
                  protocol: TCP
            - to:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: navidrome
                      app.kubernetes.io/instance: media-navidrome
                      app.kubernetes.io/name: media-navidrome
              ports:
                - port: 4533
                  protocol: TCP
          ingress: []
