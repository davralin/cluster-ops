---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name karakeep
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 30m
  driftDetection:
    mode: enabled
  targetNamespace: karakeep
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  values:
    fullnameOverride: *name
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
    controllers:
      karakeep:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          karakeep:
            image:
              repository: ghcr.io/karakeep-app/karakeep
              tag: 0.34.0@sha256:151cdd6b5f2e21635645983e126f411675bfa35becb02c028c1a727f45f899c6
            env:
              BROWSER_WEBSOCKET_URL: ws://browserless.browserless.svc.cluster.local:3000/chromium
              CRAWLER_DOWNLOAD_BANNER_IMAGE: true
              CRAWLER_ENABLE_ADBLOCKER: true
              CRAWLER_STORE_SCREENSHOT: true
              CRAWLER_FULL_PAGE_SCREENSHOT: true
              CRAWLER_FULL_PAGE_ARCHIVE: true
              CRAWLER_JOB_TIMEOUT_SEC: 240
              CRAWLER_NAVIGATE_TIMEOUT_SEC: 120
              CRAWLER_VIDEO_DOWNLOAD: true
              CRAWLER_VIDEO_DOWNLOAD_MAX_SIZE: -1
              CRAWLER_VIDEO_DOWNLOAD_TIMEOUT_SEC: 1200
              DATA_DIR: /data
              DISABLE_SIGNUPS: true
              MEILI_ADDR: http://karakeep-meilisearch.karakeep.svc.cluster.local:7700
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secret
                    key: meilisearch_master_key
              NEXTAUTH_SECRET:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secret
                    key: encryption_key
              NEXTAUTH_URL: "https://karakeep.${SECRET_DEFAULT_DOMAIN}"
              DISABLE_NEW_RELEASE_CHECK: true
              COREPACK_INTEGRITY_KEYS: 0
              S6_READ_ONLY_ROOT: 1
              OPENAI_BASE_URL: http://litellm.litellm.svc.cluster.local:4000/v1
              OPENAI_API_KEY:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secret
                    key: OPENAI_API_KEY
              INFERENCE_ENABLE_AUTO_SUMMARIZATION: true
              INFERENCE_JOB_TIMEOUT_SEC: 900
              INFERENCE_TEXT_MODEL: github_copilot/claude-haiku-4.5
            probes:
              liveness: &probes
                enabled: true
              readiness: *probes
              startup: *probes
            securityContext:
              # S6-overlay sucks.
              runAsUser: 0
              runAsGroup: 0
              fsGroup: 0
              fsGroupChangePolicy: "OnRootMismatch"
              runAsNonRoot: false
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
            resources:
              requests:
                cpu: 10m
                memory: 500Mi
              limits:
                memory: 2Gi
      meilisearch:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          meilisearch:
            image:
              repository: docker.io/getmeili/meilisearch
              tag: v1.55.0@sha256:ff546679970126f8822e15d1b6a06bfbff1f2ce2e43f810cfb5258012f92de5c
            env:
              MEILI_NO_ANALYTICS: true
              MEILI_UPGRADE_DB: true
              MEILI_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: karakeep-secret
                    key: meilisearch_master_key
              HF_HOME: /meili_data/hf_home
            probes:
              liveness: &probes
                enabled: true
              readiness: *probes
              startup: *probes
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              # ERROR meilisearch: error=Read-only file system (os error 30)
              readOnlyRootFilesystem: false
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 4Gi
    service:
      karakeep:
        controller: *name
        primary: true
        ports:
          http:
            port: &port 3000
      meilisearch:
        controller: meilisearch
        ports:
          http:
            port: 7700
    ingress:
      karakeep:
        enabled: true
        annotations:
          haproxy.org/allow-list: "${HAPROXY_WHITELIST}"
          haproxy.org/ssl-redirect-port: "443"
          haproxy.org/response-set-header: |
            Strict-Transport-Security "max-age=31536000"
            X-Frame-Options "SAMEORIGIN"
            X-Content-Type-Options "nosniff"
            Referrer-Policy "strict-origin-when-cross-origin"
        hosts:
          - host: &host "karakeep.${SECRET_DEFAULT_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: karakeep
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      data:
        existingClaim: karakeep
        advancedMounts:
          karakeep:
            karakeep:
              - path: /data
      meilisearch-data:
        existingClaim: karakeep-meilisearch
        advancedMounts:
          meilisearch:
            meilisearch:
              - path: /meili_data
      # Failed to write image to cache JXUmFfUqFn4PInl-1vtDwKCUKRDWa0AkY7H-z+TAoP0=
      # Error: ENOENT: no such file or directory, mkdir '/app/apps/web/.next/cache'
      app-next-cache:
        type: emptyDir
        advancedMounts:
          karakeep:
            karakeep:
              - path: /app/apps/web/.next/cache
      # S6-overlay sucks
      run:
        type: emptyDir
        advancedMounts:
          karakeep:
            karakeep:
              - path: /run
      # Error: ENOENT: no such file or directory, mkdir '/tmp/tsx-0'
      tmp:
        type: emptyDir
        advancedMounts:
          karakeep:
            karakeep:
              - path: /tmp
    networkpolicies:
      karakeep:
        enabled: true
        controller: karakeep
        policyTypes:
          - Egress
          - Ingress
        rules:
          egress:
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
              ports:
                - port: 53
                  protocol: UDP
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: browserless
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: browserless
                      app.kubernetes.io/instance: browserless-browserless
                      app.kubernetes.io/name: browserless-browserless
              ports:
                - port: 3000
                  protocol: TCP
            - to:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: meilisearch
                      app.kubernetes.io/instance: karakeep-karakeep
                      app.kubernetes.io/name: karakeep-karakeep
              ports:
                - port: 7700
                  protocol: TCP
            - to: # litellm
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: litellm
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: litellm
                      app.kubernetes.io/instance: litellm-litellm
                      app.kubernetes.io/name: litellm-litellm
              ports:
                - port: 4000
                  protocol: TCP
            - to: # Needs to archive, and connect to openrouter
              - ipBlock:
                  cidr: 0.0.0.0/0
                  except:
                  - "${HAPROXY_WHITELIST}"
              ports:
                - port: 80
                  protocol: TCP
                - port: 443
                  protocol: TCP
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: haproxy-controller
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: kubernetes-ingress
              ports:
                - port: *port
      meilisearch:
        enabled: true
        controller: meilisearch
        policyTypes:
          - Egress
          - Ingress
        rules:
          egress: []
          ingress:
            - from:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: karakeep
                      app.kubernetes.io/instance: karakeep-karakeep
                      app.kubernetes.io/name: karakeep-karakeep
              ports:
                - port: 7700
