---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name karakeep-restic
  namespace: &namespace karakeep
spec:
  interval: 30m
  chart:
    spec:
      chart: raw
      version: v0.3.2
      sourceRef:
        kind: HelmRepository
        name: dysnix-charts
        namespace: flux-system
      interval: 30m
  driftDetection:
    mode: enabled
  targetNamespace: karakeep
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  dependsOn:
    - name: volsync
      namespace: flux-system
    - name: karakeep
      namespace: flux-system
  values:
    resources:
      - apiVersion: v1
        kind: Secret
        metadata:
          name: karakeep-volsync-secret
          namespace: karakeep
        type: Opaque
        stringData:
          RESTIC_REPOSITORY: "s3:https://s3.${SECRET_DEFAULT_DOMAIN}/volsync-${CLUSTER_NAME}/karakeep"
          RESTIC_PASSWORD: "${SECRET_VOLSYNC_RESTIC_PWD}"
          AWS_ACCESS_KEY_ID: "${SECRET_S3_VOLSYNC_ACCESS_KEYS}"
          AWS_SECRET_ACCESS_KEY: "${SECRET_S3_VOLSYNC_SECRET_KEYS}"
          AWS_DEFAULT_REGION: "garage"
      - apiVersion: volsync.backube/v1alpha1
        kind: ReplicationSource
        metadata:
          name: *name
          namespace: *namespace
        spec:
          sourcePVC: karakeep
          trigger:
            schedule: "14 14 * * *"
          restic:
            copyMethod: Direct
            pruneIntervalDays: 7
            repository: karakeep-volsync-secret
            moverSecurityContext:
              runAsUser: 1000
              runAsGroup: 1000
              fsGroup: 1000
              fsGroupChangePolicy: "OnRootMismatch"
              runAsNonRoot: true
              seccompProfile:
                type: RuntimeDefault
            retain:
              daily: 7
              within: 3d
      - apiVersion: cilium.io/v2
        kind: CiliumNetworkPolicy
        metadata:
          name: *name
          namespace: *namespace
        spec:
          endpointSelector:
            matchLabels:
              app.kubernetes.io/created-by: volsync
          egress:
            - toEndpoints:
                - matchLabels:
                    k8s:io.kubernetes.pod.namespace: kube-system
                    k8s:k8s-app: kube-dns
              toPorts:
                - ports:
                    - port: "53"
                      protocol: ANY
                  rules:
                    dns:
                      - matchName: "s3.${SECRET_DEFAULT_DOMAIN}"
            - toFQDNs:
                - matchName: "s3.${SECRET_DEFAULT_DOMAIN}"
              toPorts:
                - ports:
                    - port: "443"
                      protocol: TCP
