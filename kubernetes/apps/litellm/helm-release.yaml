---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name litellm
  namespace: flux-system
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 5.3.0
      sourceRef:
        kind: HelmRepository
        name: bjw-s-charts
        namespace: flux-system
      interval: 30m
  driftDetection:
    mode: enabled
  targetNamespace: litellm
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  dependsOn:
    - name: litellm-postgres-v18
      namespace: flux-system
    - name: litellm-valkey
      namespace: flux-system
  values:
    fullnameOverride: *name
    global:
      createDefaultServiceAccount: false
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: "OnRootMismatch"
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/controller: litellm
              topologyKey: kubernetes.io/hostname
    controllers:
      litellm:
        replicas: 3
        podDisruptionBudget:
          minAvailable: 1
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          litellm:
            image:
              repository: ghcr.io/berriai/litellm-non_root
              tag: 1.110.3@sha256:d9790b3eba82a99bd074f26ceb0f471385365115f460f04f1f19d62e2f11461b
            args:
              - "--config"
              - "/config/config.yaml"
            env:
              DATABASE_HOST: litellm-postgres-v18-rw.litellm.svc.cluster.local
              DATABASE_PORT: "5432"
              DATABASE_NAME: litellm
              REDIS_HOST: litellm-valkey.litellm.svc.cluster.local
              REDIS_PORT: "6379"
              DATABASE_USERNAME:
                valueFrom:
                  secretKeyRef:
                    name: litellm-basic-auth
                    key: username
              DATABASE_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: litellm-basic-auth
                    key: password
              GITHUB_COPILOT_TOKEN_DIR: /data/copilot-tokens
              LITELLM_NON_ROOT: true
              LITELLM_MASTER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-secrets
                    key: master-key
              LITELLM_MIGRATION_DIR: /tmp/migration
              LITELLM_SALT_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-secrets
                    key: salt-key
              PROMETHEUS_METRICS_PORT: "4001"
              USE_PRISMA_MIGRATE: true
              TZ: "${TIMEZONE}"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/liveliness
                    port: &port 4000
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/readiness
                    port: *port
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  failureThreshold: 30
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 1Gi
              limits:
                memory: 2Gi
    configMaps:
      config:
        data:
          config.yaml: |
            general_settings:
              store_model_in_db: true
            litellm_settings:
              drop_params: true
              additional_drop_params: ["context_management"]
              check_provider_endpoint: true
              cache: true
              cache_params:
                type: redis
                host: os.environ/REDIS_HOST
                port: os.environ/REDIS_PORT
                namespace: litellm
                ttl: 3600
              enable_redis_auth_cache: true
              callbacks:
                - prometheus
            router_settings:
              redis_host: os.environ/REDIS_HOST
              redis_port: os.environ/REDIS_PORT
    service:
      litellm:
        controller: *name
        ports:
          http:
            port: *port
      metrics:
        controller: *name
        ports:
          metrics:
            port: 4001
    serviceMonitor:
      metrics:
        enabled: true
        serviceName: litellm-metrics
        endpoints:
          - port: metrics
            scheme: http
            path: /metrics/
            interval: 60s
            scrapeTimeout: 10s
    ingress:
      litellm:
        enabled: true
        annotations:
          haproxy.org/allow-list: "${HAPROXY_WHITELIST}"
          haproxy.org/ssl-redirect-port: "443"
          haproxy.org/timeout-server: "180s"
          haproxy.org/response-set-header: |
            Strict-Transport-Security "max-age=31536000"
            X-Frame-Options "DENY"
            X-Content-Type-Options "nosniff"
            Referrer-Policy "strict-origin-when-cross-origin"
        hosts:
          - host: &host "litellm.${SECRET_DEFAULT_DOMAIN}"
            paths:
              - path: /
                service:
                  identifier: litellm
                  port: http
        tls:
          - hosts:
              - *host
    persistence:
      data:
        enabled: true
        existingClaim: litellm
      tmp:
        enabled: true
        type: emptyDir
      config:
        enabled: true
        type: configMap
        name: litellm
        globalMounts:
          - path: /config
    networkpolicies:
      litellm:
        enabled: true
        controller: *name
        policyTypes:
          - Egress
          - Ingress
        rules:
          egress:
            - to:
                - podSelector:
                    matchLabels:
                      cnpg.io/cluster: litellm-postgres-v18
              ports:
                - port: 5432
                  protocol: TCP
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: kube-system
                  podSelector:
                    matchLabels:
                      k8s-app: kube-dns
              ports:
                - port: 53
                  protocol: UDP
                - port: 53
                  protocol: TCP
            - to:
                - podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: valkey
                      app.kubernetes.io/instance: litellm-valkey
                      app.kubernetes.io/name: litellm-valkey
              ports:
                - port: 6379
                  protocol: TCP
            - to:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: meridian
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: meridian
                      app.kubernetes.io/instance: meridian-meridian
                      app.kubernetes.io/name: meridian-meridian
              ports:
                - port: 3456
                  protocol: TCP
            - to: # Allow talking to models
              - ipBlock:
                  cidr: 0.0.0.0/0
                  except:
                  - "${HAPROXY_WHITELIST}"
          ingress:
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: haproxy-controller
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: kubernetes-ingress
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: prometheus
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: prometheus
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: karakeep
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: karakeep
                      app.kubernetes.io/instance: karakeep-karakeep
                      app.kubernetes.io/name: karakeep-karakeep
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: wallos
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: wallos
                      app.kubernetes.io/instance: wallos-wallos
                      app.kubernetes.io/name: wallos-wallos
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: audiomuseai
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: audiomuseai
                      app.kubernetes.io/instance: audiomuseai-audiomuseai
                      app.kubernetes.io/name: audiomuseai-audiomuseai
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: audiomuseai
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: worker
                      app.kubernetes.io/instance: audiomuseai-audiomuseai
                      app.kubernetes.io/name: audiomuseai-audiomuseai
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: hermes-agent
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/controller: hermes-agent
                      app.kubernetes.io/instance: hermes-agent-hermes-agent
                      app.kubernetes.io/name: hermes-agent-hermes-agent
              ports:
                - port: *port
            - from:
                - namespaceSelector:
                    matchLabels:
                      kubernetes.io/metadata.name: prometheus
                  podSelector:
                    matchLabels:
                      app.kubernetes.io/name: prometheus
              ports:
                - port: 4001
