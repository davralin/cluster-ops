---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &name external-dns
  namespace: flux-system
spec:
  interval: 30m
  driftDetection:
    mode: enabled
  chart:
    spec:
      chart: external-dns
      version: 1.22.0
      sourceRef:
        kind: HelmRepository
        name: external-dns-charts
        namespace: flux-system
      interval: 30m
  dependsOn:
    - name: kube-prometheus-stack-crds
      namespace: flux-system
  targetNamespace: external-dns
  install:
    createNamespace: true
    remediation:
      retries: 10
  upgrade:
    remediation:
      retries: 10
  values:
    fullnameOverride: *name
    provider:
      name: inmemory
    sources:
      - service
    policy: upsert-only
    registry: noop
    domainFilters:
      - ${SECRET_DEFAULT_DOMAIN}
    annotationFilter: external-dns.alpha.kubernetes.io/managed-by=external-dns
    interval: 5m
    logLevel: info
    extraArgs:
      - --dry-run
      - --inmemory-zone=${SECRET_DEFAULT_DOMAIN}
    serviceMonitor:
      enabled: "${MONITORING_PROMETHEUS}"
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
